name: OCI Free-Tier Cost Killswitch

# Separate from oci-provision-retry.yml: this watches spend on an already-running
# deployment rather than provisioning it. OCI Budgets can only email an alert on
# its own — nothing stops automatically — so this workflow is what actually
# enforces the free-tier ceiling by stopping every job-portal instance the moment
# month-to-date cost crosses OCI_COST_LIMIT_USD.
#
# See scripts/oci-cost-killswitch.sh for the actual cost-check-and-stop logic —
# this workflow's job is just to schedule that script and react to its outcome.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  issues: write
  actions: write

jobs:
  check-cost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OCI CLI
        run: pip install oci-cli

      - name: Configure OCI CLI from secrets
        run: |
          mkdir -p ~/.oci
          printf '%s' "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/key.pem
          EOF

      - name: Check cost and stop instances if over budget
        id: killswitch
        env:
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_NOTIFICATION_TOPIC_ID: ${{ secrets.OCI_NOTIFICATION_TOPIC_ID }}
          OCI_COST_LIMIT_USD: ${{ vars.OCI_COST_LIMIT_USD }}
        run: bash scripts/oci-cost-killswitch.sh

      - name: Flag the trip and stop the schedule
        if: steps.killswitch.outputs.triggered == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "resources exceed free limit — instances stopped" \
            --body "Month-to-date cost: \$${{ steps.killswitch.outputs.cost }}

          All job-portal instances (core/edge/aux) were stopped automatically to
          prevent further charges. Investigate why the free-tier ceiling was
          crossed before restarting anything — this workflow has disabled itself
          so it doesn't loop on an already-stopped deployment."
          gh workflow disable "oci-cost-killswitch.yml"
