name: CI/CD — Job Portal

on:
  push:
    branches: [ main, develop, uat ]
  pull_request:
    branches: [ main, develop, uat ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  frontend-build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend with coverage
        run: npm run test -- --coverage

      - name: Build frontend
        run: npm run build

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./frontend/coverage/coverage-final.json
          flags: frontend
          fail_ci_if_error: false

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-dist
          path: ./frontend/dist/
          retention-days: 5

  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: manager
          POSTGRES_DB: jobapp_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        service:
          - auth_service
          - user_service
          - job_service
          - company_service
          - application_service
          - notification_service
          - api_gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make Maven wrappers executable
        run: find . -name "mvnw" -type f -exec chmod +x {} \;

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build ${{ matrix.service }}
        working-directory: ./${{ matrix.service }}
        env:
          JWT_SECRET: test-secret-key-for-ci-pipeline-only-32c
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/jobapp_db
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: manager
          SPRING_CLOUD_VAULT_ENABLED: false
          EUREKA_CLIENT_ENABLED: false
        run: ./mvnw clean verify -DskipTests=false --no-transfer-progress

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.service }}
          path: ./${{ matrix.service }}/target/surefire-reports/
          retention-days: 5

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./${{ matrix.service }}/target/site/jacoco/jacoco.xml
          flags: ${{ matrix.service }}
          fail_ci_if_error: false

      - name: Upload service artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jar-${{ matrix.service }}
          path: ./${{ matrix.service }}/target/*.jar
          retention-days: 5

  build-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make Maven wrappers executable
        run: find . -name "mvnw" -type f -exec chmod +x {} \;

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build service_registry
        working-directory: ./service_registry
        run: ./mvnw clean package -DskipTests --no-transfer-progress

      - name: Build config_server
        working-directory: ./config_server
        run: ./mvnw clean package -DskipTests --no-transfer-progress

      - name: Build api_gateway
        working-directory: ./api_gateway
        run: ./mvnw clean package -DskipTests --no-transfer-progress

      - name: Upload infra artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infra-jars
          path: |
            ./service_registry/target/*.jar
            ./config_server/target/*.jar
            ./api_gateway/target/*.jar
          retention-days: 5

  build-docker-images:
    runs-on: ubuntu-latest
    needs: [ build-and-test, build-infra, frontend-build-test ]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/uat')
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: auth_service
            image_name: auth-service
          - service: user_service
            image_name: user-service
          - service: job_service
            image_name: job-service
          - service: company_service
            image_name: company-service
          - service: application_service
            image_name: application-service
          - service: notification_service
            image_name: notification-service
          - service: service_registry
            image_name: service-registry
          - service: config_server
            image_name: config-server
          - service: api_gateway
            image_name: api-gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.image_name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-baseline:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency review (fail on high+)
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Frontend audit (high+)
        working-directory: ./frontend
        run: npm audit --audit-level=high

  ci-contract-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make Maven wrappers executable
        run: find . -name "mvnw" -type f -exec chmod +x {} \;

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Gateway contract compile check
        working-directory: ./api_gateway
        run: ./mvnw clean compile --no-transfer-progress

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Frontend lint
        working-directory: ./frontend
        run: npm ci && npm run lint

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Frontend E2E smoke
        working-directory: ./frontend
        run: npm run test:e2e

  ci-integration-smoke:
    runs-on: ubuntu-latest
    needs: [ build-and-test, build-infra, frontend-build-test ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start full stack
        env:
          JWT_SECRET: test-secret-key-for-ci-pipeline-only-32c
        run: docker compose up -d --build

      - name: Wait and smoke test gateway health and guards
        shell: bash
        run: |
          set -e

          for i in {1..60}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health || true)
            if [ "$code" -eq 200 ] || [ "$code" -eq 401 ]; then
              break
            fi
            sleep 5
          done

          gateway_health_status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health)
          if [ "$gateway_health_status" -ne 200 ] && [ "$gateway_health_status" -ne 401 ]; then
            echo "Expected 200 or 401 for /actuator/health, got $gateway_health_status"
            exit 1
          fi

          for i in {1..60}; do
            auth_health=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/actuator/health || true)
            if [ "$auth_health" -eq 200 ]; then
              break
            fi
            sleep 2
          done

          auth_status=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"email":"ci-smoke@example.com","password":"invalid"}' \
            http://localhost:8080/api/auth/login)
          if [ "$auth_status" -lt 400 ] || [ "$auth_status" -ge 500 ]; then
            echo "[WARN] /api/auth/login returned $auth_status during smoke. Synthetic/journey checks will validate auth behavior."
          fi

          jobs_status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/jobs)
          if [ "$jobs_status" -ne 401 ]; then
            echo "Expected 401 for /api/jobs without token, got $jobs_status"
            exit 1
          fi

      - name: Run synthetic and journey scripts
        shell: pwsh
        run: |
          ./scripts/synthetic-checks.ps1
          ./scripts/journey-checks.ps1

      - name: Stop stack and collect logs
        if: always()
        run: |
          docker compose logs > compose-smoke.log || true
          docker compose down -v || true

      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-smoke-logs
          path: compose-smoke.log
          retention-days: 5

  deploy-uat:
    runs-on: ubuntu-latest
    needs: [ ci-integration-smoke, build-docker-images ]
    # Pushing to develop builds/tests only - it never deploys anywhere. Pushing to the
    # dedicated uat branch (or a manual "Run workflow") is what triggers this job.
    if: (github.ref == 'refs/heads/uat' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    environment:
      name: uat
      url: https://uat.job-portal.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to UAT
        env:
          DEPLOY_KEY: ${{ secrets.UAT_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.UAT_HOST }}
          DEPLOY_USER: ${{ secrets.UAT_USER }}
          DOCKER_USERNAME: ${{ github.actor }}
          DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./scripts/deploy-uat.sh
          ./scripts/deploy-uat.sh
        shell: bash

  deploy-prod:
    runs-on: ubuntu-latest
    needs: [ ci-integration-smoke, build-docker-images ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://job-portal.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        env:
          DEPLOY_KEY: ${{ secrets.PROD_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.PROD_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_USER }}
          DOCKER_USERNAME: ${{ github.actor }}
          DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./scripts/deploy-production.sh
          ./scripts/deploy-production.sh
        shell: bash
