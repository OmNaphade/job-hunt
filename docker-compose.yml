services:

  postgres:
    image: postgres:16-alpine
    container_name: jobportal-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: manager
      POSTGRES_DB: jobapp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: jobportal-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: jobportal-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: jobportal-zipkin
    ports:
      - "9411:9411"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9411/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  service-registry:
    build:
      context: .
      dockerfile: service_registry/Dockerfile
    container_name: service-registry
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  config-server:
    build:
      context: .
      dockerfile: config_server/Dockerfile
    container_name: config-server
    ports:
      - "8888:8888"
    depends_on:
      service-registry:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  api-gateway:
    build:
      context: .
      dockerfile: api_gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      service-registry:
        condition: service_healthy
    environment:
      - JWT_SECRET=${JWT_SECRET:-default-dev-secret-key-change-in-production-32chars}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      - SPRING_CLOUD_VAULT_ENABLED=false
      - SPRING_CLOUD_VAULT_FAIL_FAST=false
      - AUTH_SERVICE_URI=http://auth-service:8081
      - USER_SERVICE_URI=http://user-service:8082
      - JOB_SERVICE_URI=http://job-service:8083
      - COMPANY_SERVICE_URI=http://company-service:8084
      - APPLICATION_SERVICE_URI=http://application-service:8085
      - NOTIFICATION_SERVICE_URI=http://notification-service:8086
      - MONITORING_TARGETS_AUTH=http://auth-service:8081
      - MONITORING_TARGETS_USER=http://user-service:8082
      - MONITORING_TARGETS_JOB=http://job-service:8083
      - MONITORING_TARGETS_COMPANY=http://company-service:8084
      - MONITORING_TARGETS_APPLICATION=http://application-service:8085
      - MONITORING_TARGETS_NOTIFICATION=http://notification-service:8086
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
      - RATE_LIMIT_LOGIN_LIMIT=${RATE_LIMIT_LOGIN_LIMIT:-20}

  auth-service:
    build:
      context: .
      dockerfile: auth_service/Dockerfile
    container_name: auth-service
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    environment:
      - JWT_SECRET=${JWT_SECRET:-default-dev-secret-key-change-in-production-32chars}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/jobapp_db
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      - ADMIN_SEED_ENABLED=true
      - ADMIN_SEED_EMAIL=admin@jobportal.local
      - ADMIN_SEED_PASSWORD=Pass123!
      - SPRING_CLOUD_VAULT_ENABLED=false
      - SPRING_CLOUD_VAULT_FAIL_FAST=false
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans

  user-service:
    build:
      context: .
      dockerfile: user_service/Dockerfile
    container_name: user-service
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    environment:
      - JWT_SECRET=${JWT_SECRET:-default-dev-secret-key-change-in-production-32chars}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/jobapp_db
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      - SPRING_CLOUD_VAULT_ENABLED=false
      - SPRING_CLOUD_VAULT_FAIL_FAST=false
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
      - UPLOAD_DIR=/app/uploads
    volumes:
      - user_uploads_data:/app/uploads

  job-service:
    build:
      context: .
      dockerfile: job_service/Dockerfile
    container_name: job-service
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    environment:
      - JWT_SECRET=${JWT_SECRET:-default-dev-secret-key-change-in-production-32chars}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/jobapp_db
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      - SPRING_CLOUD_VAULT_ENABLED=false
      - SPRING_CLOUD_VAULT_FAIL_FAST=false
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
      - ADZUNA_APP_ID=${ADZUNA_APP_ID:-}
      - ADZUNA_APP_KEY=${ADZUNA_APP_KEY:-}
      - FINDWORK_API_KEY=${FINDWORK_API_KEY:-}
      - JOBDATALAKE_API_KEY=${JOBDATALAKE_API_KEY:-}

  company-service:
    build:
      context: .
      dockerfile: company_service/Dockerfile
    container_name: company-service
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    environment:
      - JWT_SECRET=${JWT_SECRET:-default-dev-secret-key-change-in-production-32chars}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/jobapp_db
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      - SPRING_CLOUD_VAULT_ENABLED=false
      - SPRING_CLOUD_VAULT_FAIL_FAST=false
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans

  application-service:
    build:
      context: .
      dockerfile: application_service/Dockerfile
    container_name: application-service
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    environment:
      - JWT_SECRET=${JWT_SECRET:-default-dev-secret-key-change-in-production-32chars}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/jobapp_db
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      - SPRING_CLOUD_VAULT_ENABLED=false
      - SPRING_CLOUD_VAULT_FAIL_FAST=false
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
      - UPLOAD_DIR=/app/uploads
    volumes:
      - application_uploads_data:/app/uploads

  notification-service:
    build:
      context: .
      dockerfile: notification_service/Dockerfile
    container_name: notification-service
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    environment:
      - JWT_SECRET=${JWT_SECRET:-default-dev-secret-key-change-in-production-32chars}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/jobapp_db
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MAIL_USERNAME=${MAIL_USERNAME:-noreply@jobportal.com}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      - SPRING_CLOUD_VAULT_ENABLED=false
      - SPRING_CLOUD_VAULT_FAIL_FAST=false
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans

volumes:
  postgres_data:
  user_uploads_data:
  application_uploads_data:
