# Prod profile - production defaults; DB name unchanged for backward compatibility.
# Admin auto-seed defaults OFF here - see ENVIRONMENTS.md for why.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jobapp_db}
logging.level.org.omnaphade=INFO
logging.level.root=WARN
admin.seed.enabled=${ADMIN_SEED_ENABLED:false}
