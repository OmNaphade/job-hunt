spring.application.name=api_gateway
server.port=8080

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

# Gateway Routes
spring.cloud.gateway.mvc.routes[0].id=auth-service
spring.cloud.gateway.mvc.routes[0].uri=${AUTH_SERVICE_URI:http://localhost:8081}
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.mvc.routes[1].id=user-service
spring.cloud.gateway.mvc.routes[1].uri=${USER_SERVICE_URI:http://localhost:8082}
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/users/**

spring.cloud.gateway.mvc.routes[2].id=job-service
spring.cloud.gateway.mvc.routes[2].uri=${JOB_SERVICE_URI:http://localhost:8083}
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/jobs/**

spring.cloud.gateway.mvc.routes[3].id=company-service
spring.cloud.gateway.mvc.routes[3].uri=${COMPANY_SERVICE_URI:http://localhost:8084}
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/api/companies/**

spring.cloud.gateway.mvc.routes[4].id=application-service
spring.cloud.gateway.mvc.routes[4].uri=${APPLICATION_SERVICE_URI:http://localhost:8085}
spring.cloud.gateway.mvc.routes[4].predicates[0]=Path=/api/applications/**

spring.cloud.gateway.mvc.routes[5].id=notification-service
spring.cloud.gateway.mvc.routes[5].uri=${NOTIFICATION_SERVICE_URI:http://localhost:8086}
spring.cloud.gateway.mvc.routes[5].predicates[0]=Path=/api/notifications/**

# JWT
jwt.secret=${JWT_SECRET:default-dev-secret-key-change-in-production-32chars}

# Monitoring Target Endpoints
monitoring.targets.gateway=http://localhost:8080
monitoring.targets.auth=http://localhost:8081
monitoring.targets.user=http://localhost:8082
monitoring.targets.job=http://localhost:8083
monitoring.targets.company=http://localhost:8084
monitoring.targets.application=http://localhost:8085
monitoring.targets.notification=http://localhost:8086

# Actuator
management.endpoints.web.exposure.include=health,info
