services:

  frontend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_ALLOW_SELF_REGISTER: "true"
    container_name: frontend
    mem_limit: 256m
    ports:
      - "80:80"
    environment:
      # job-portal-core's VCN-internal DNS name (see OCI_DEPLOYMENT_GUIDE.md) — no
      # depends_on here since api-gateway now lives on a separate host; Caddy just
      # returns 502 until it's reachable rather than failing to start.
      - CORE_UPSTREAM=${CORE_UPSTREAM:-job-portal-core:8080}
