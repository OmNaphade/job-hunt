resilience4j.circuitbreaker.instances.aiDevJobsImport.slow-call-rate-threshold=100
resilience4j.circuitbreaker.instances.aiDevJobsImport.slow-call-duration-threshold=3s
resilience4j.retry.instances.aiDevJobsImport.max-attempts=3
resilience4j.retry.instances.aiDevJobsImport.wait-duration=500ms
resilience4j.timelimiter.instances.aiDevJobsImport.timeout-duration=3s

