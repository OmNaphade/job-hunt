spring.application.name=job_service
server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5432/jobapp_db
spring.datasource.username=postgres
spring.datasource.password=manager

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jackson.time-zone=Asia/Kolkata

jwt.secret=${JWT_SECRET:default-dev-secret-key-change-in-production-32chars}

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Distributed Tracing
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true

# Adzuna external job import (https://developer.adzuna.com/) — app-id/app-key are blank by default so
# the importer safely no-ops until a real key is supplied via ADZUNA_APP_ID/ADZUNA_APP_KEY.
# Scoped to IT/tech by default via the "category" tag Adzuna documents for this purpose.
adzuna.base-url=${ADZUNA_BASE_URL:https://api.adzuna.com/v1/api}
adzuna.app-id=${ADZUNA_APP_ID:}
adzuna.app-key=${ADZUNA_APP_KEY:}
adzuna.country=${ADZUNA_COUNTRY:us}
adzuna.results-per-page=${ADZUNA_RESULTS_PER_PAGE:20}
adzuna.max-pages-per-run=${ADZUNA_MAX_PAGES_PER_RUN:5}
adzuna.import-interval-ms=${ADZUNA_IMPORT_INTERVAL_MS:21600000}
adzuna.category=${ADZUNA_CATEGORY:it-jobs}
adzuna.keyword=${ADZUNA_KEYWORD:}

resilience4j.circuitbreaker.instances.adzunaImport.register-health-indicator=true
resilience4j.circuitbreaker.instances.adzunaImport.sliding-window-size=10
resilience4j.circuitbreaker.instances.adzunaImport.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.adzunaImport.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.adzunaImport.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.adzunaImport.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.adzunaImport.slow-call-rate-threshold=100
resilience4j.circuitbreaker.instances.adzunaImport.slow-call-duration-threshold=3s
resilience4j.retry.instances.adzunaImport.max-attempts=3
resilience4j.retry.instances.adzunaImport.wait-duration=500ms
resilience4j.timelimiter.instances.adzunaImport.timeout-duration=3s

# Himalayas external job import (https://himalayas.app/api) — free, no key required, explicitly
# tech/remote-focused. "query" is the free-text keyword sent to Himalayas' own search endpoint.
himalayas.base-url=${HIMALAYAS_BASE_URL:https://himalayas.app}
himalayas.query=${HIMALAYAS_QUERY:software developer}
himalayas.results-per-page=${HIMALAYAS_RESULTS_PER_PAGE:20}
himalayas.max-pages-per-run=${HIMALAYAS_MAX_PAGES_PER_RUN:5}

resilience4j.circuitbreaker.instances.himalayasImport.register-health-indicator=true
resilience4j.circuitbreaker.instances.himalayasImport.sliding-window-size=10
resilience4j.circuitbreaker.instances.himalayasImport.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.himalayasImport.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.himalayasImport.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.himalayasImport.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.himalayasImport.slow-call-rate-threshold=100
resilience4j.circuitbreaker.instances.himalayasImport.slow-call-duration-threshold=3s
resilience4j.retry.instances.himalayasImport.max-attempts=3
resilience4j.retry.instances.himalayasImport.wait-duration=500ms
resilience4j.timelimiter.instances.himalayasImport.timeout-duration=3s

# Arbeitnow external job import (https://www.arbeitnow.com/api/job-board-api) — free, no key required.
# Has no server-side keyword filter, so relevance is filtered client-side against "tech-keywords"
# (comma-separated, matched case-insensitively against the job's title and tags).
arbeitnow.base-url=${ARBEITNOW_BASE_URL:https://www.arbeitnow.com/api/job-board-api}
arbeitnow.max-pages-per-run=${ARBEITNOW_MAX_PAGES_PER_RUN:5}
arbeitnow.tech-keywords=${ARBEITNOW_TECH_KEYWORDS:developer,engineer,software,programmer,devops,frontend,front-end,backend,back-end,full stack,fullstack,data scientist,data engineer,it,cloud,sre,qa,sysadmin,security}

resilience4j.circuitbreaker.instances.arbeitnowImport.register-health-indicator=true
resilience4j.circuitbreaker.instances.arbeitnowImport.sliding-window-size=10
resilience4j.circuitbreaker.instances.arbeitnowImport.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.arbeitnowImport.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.arbeitnowImport.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.arbeitnowImport.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.arbeitnowImport.slow-call-rate-threshold=100
resilience4j.circuitbreaker.instances.arbeitnowImport.slow-call-duration-threshold=3s
resilience4j.retry.instances.arbeitnowImport.max-attempts=3
resilience4j.retry.instances.arbeitnowImport.wait-duration=500ms
resilience4j.timelimiter.instances.arbeitnowImport.timeout-duration=3s
