spring.application.name=job_service
server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5432/jobapp_db
spring.datasource.username=postgres
spring.datasource.password=manager

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jackson.time-zone=Asia/Kolkata

jwt.secret=${JWT_SECRET:default-dev-secret-key-change-in-production-32chars}

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Distributed Tracing
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true

# Adzuna external job import (https://developer.adzuna.com/) — app-id/app-key are blank by default so
# the importer safely no-ops until a real key is supplied via ADZUNA_APP_ID/ADZUNA_APP_KEY.
adzuna.base-url=${ADZUNA_BASE_URL:https://api.adzuna.com/v1/api}
adzuna.app-id=${ADZUNA_APP_ID:}
adzuna.app-key=${ADZUNA_APP_KEY:}
adzuna.country=${ADZUNA_COUNTRY:us}
adzuna.results-per-page=${ADZUNA_RESULTS_PER_PAGE:20}
adzuna.max-pages-per-run=${ADZUNA_MAX_PAGES_PER_RUN:5}
adzuna.import-interval-ms=${ADZUNA_IMPORT_INTERVAL_MS:21600000}

resilience4j.circuitbreaker.instances.adzunaImport.register-health-indicator=true
resilience4j.circuitbreaker.instances.adzunaImport.sliding-window-size=10
resilience4j.circuitbreaker.instances.adzunaImport.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.adzunaImport.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.adzunaImport.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.adzunaImport.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.adzunaImport.slow-call-rate-threshold=100
resilience4j.circuitbreaker.instances.adzunaImport.slow-call-duration-threshold=3s
resilience4j.retry.instances.adzunaImport.max-attempts=3
resilience4j.retry.instances.adzunaImport.wait-duration=500ms
resilience4j.timelimiter.instances.adzunaImport.timeout-duration=3s
